# upstream.lock: the pinned kmp-lsp release assets ktsense ships under libexec/.
#
# The pin itself lives in ktsense-lsp::PINNED_UPSTREAM_VERSION and is authoritative. The `version`
# record below must agree with it; scripts/fetch-upstream-engine.sh does not read the Rust source, so
# a bump has to touch both.
#
# Upstream names its release assets <os>-<arch>, not by Rust target triple, and publishes the same
# linux asset for gnu and musl consumers. The mapping from target to asset is therefore recorded here
# rather than derived.
#
# Each tarball carries both `kmp-lsp` and `kmp-jar-indexer` at its root with no leading directory, so
# the separate kmp-jar-indexer-<os>-<arch>.gz assets are redundant and are not fetched.
#
# Format, whitespace separated, `#` begins a comment:
#   version  <pinned upstream version>
#   repo     <github owner/name>
#   tag      <release tag the assets hang off>
#   manifest <sha256 of upstream's own sha256sums.txt> <its asset name>
#   asset    <rust target> <asset name> <sha256> <bytes>

version  0.26.0
repo     Hessesian/kmp-lsp
