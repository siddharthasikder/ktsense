[package]
name = "ktsense-mcp"
description = "MCP stdio server exposing the ktsense commands as agent tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The dependency list is the layering statement AGENTS.md enforces, so it carries only what is
# actually used: this crate reaches ktsense-lsp to hold a warm session and to read a root URI, and
# nothing else. ktsense-core and ktsense-syntax were declared and never referenced, which overstated
# the graph the table is meant to describe.
[dependencies]
ktsense-lsp = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rmcp = { version = "2.2.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
