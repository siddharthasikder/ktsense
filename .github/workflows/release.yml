name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stage the artifacts under, without the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
            runnable: true
          # ubuntu-latest is x64, so the aarch64 binary cannot be executed where it is built.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
            runnable: false
          # GitHub retired macos-13 on 2025-12-04 and macos-15-intel is the x86_64 label that
          # replaced it; macos-14 is itself deprecated until 2026-11-02, so both darwin jobs sit on
          # the macOS 15 images.
          - target: aarch64-apple-darwin
            runner: macos-15
            builder: cargo
            runnable: true
            sign: adhoc
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            builder: cargo
            runnable: true
            sign: adhoc
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          raw="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "refusing release version '$raw': expected vX.Y.Z or X.Y.Z with an optional -suffix" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pinned toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup show active-toolchain

      - name: Install zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Cross-compile for musl
        if: matrix.builder == 'zigbuild'
        env:
          TARGET: ${{ matrix.target }}
          KTSENSE_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: cargo zigbuild --release --locked --target "$TARGET" -p ktsense-cli

      - name: Build natively for darwin
        if: matrix.builder == 'cargo'
        env:
          TARGET: ${{ matrix.target }}
          KTSENSE_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked --target "$TARGET" -p ktsense-cli

      - name: Acquire the pinned upstream engine
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/fetch-upstream-engine.sh --target "$TARGET" --dest engine
          test -x engine/kmp-lsp
          ls -l engine

      - name: Package the artifact
        id: stage
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGN: ${{ matrix.sign || 'none' }}
        run: |
          name="ktsense-$VERSION-$TARGET"
          scripts/package-release.sh \
            --target "$TARGET" --version "$VERSION" \
            --bin "target/$TARGET/release/ktsense" \
            --engine engine \
            --skill contrib/agent-skill/SKILL.md \
            --license LICENSE \
            --license-upstream LICENSE.kmp-lsp \
            --dest dist --sign "$SIGN"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Musl binary is statically linked
        if: matrix.builder == 'zigbuild'
        env:
          NAME: ${{ steps.stage.outputs.name }}
        run: file "dist/$NAME/bin/ktsense" | grep -F 'statically linked'

      - name: Packaged binary reports the release version
        if: matrix.runnable
        env:
          NAME: ${{ steps.stage.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          "dist/$NAME/bin/ktsense" --version | tee /dev/stderr | grep -Fxq "ktsense $VERSION"

      - name: Engine reports the pinned version
        if: matrix.runnable
        env:
          NAME: ${{ steps.stage.outputs.name }}
        run: |
          pin="$(awk '$1 == "version" { print $2; exit }' upstream.lock)"
          "dist/$NAME/libexec/kmp-lsp" --version
          "dist/$NAME/libexec/kmp-lsp" --version | grep -Fx "kmp-lsp $pin"

      - name: Darwin binaries carry an ad-hoc signature
        if: matrix.sign == 'adhoc'
        env:
          NAME: ${{ steps.stage.outputs.name }}
        run: |
          codesign -dv "dist/$NAME/bin/ktsense"
          codesign -dv "dist/$NAME/libexec/kmp-lsp"

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            dist/${{ steps.stage.outputs.name }}.tar.gz
            dist/${{ steps.stage.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
