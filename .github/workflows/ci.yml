name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes an in-flight run obsolete; cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux stays pinned to ubuntu-24.04 until Ubuntu 26 is deliberately certified; macos-15
        # keeps arm64 on a currently supported image.
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml is the single source of truth for channel,
      # components and targets; install exactly what it pins.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The release packaging script has no compiler to catch a regression, so its layout, Intel-darwin
  # sidecar exclusion and reproducibility are asserted directly. No network or real engine needed.
  packaging:
    name: release packaging script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Release version validation accepts and rejects
        run: bash scripts/tests/release-version.test.sh

      - name: Package layout, sidecar policy and reproducibility
        run: bash scripts/tests/package-release.test.sh

  # A compile-time env cannot be checked from a unit test, so the KTSENSE_BUILD_VERSION contract is
  # proven by building the binary in an isolated target dir and reading `--version`: dev fallback,
  # explicit override, and recompilation when the override changes.
  build-version:
    name: build version injection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Fallback, override and cache correctness
        run: bash scripts/tests/build-version.test.sh

  # Gate 2 (KT-25): the same suite with the engine-gated tests compiled in, against the pinned
  # upstream binary, plus the publishable compression gate over the real corpora. A separate job so
  # the install-free suite above stays fast and never depends on the network.
  real-lsp:
    name: real-lsp tests and compression gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # The pin lives in one place, ktsense-lsp::PINNED_UPSTREAM_VERSION; read it rather than
      # repeat it, so a deliberate bump there is the only edit a release needs.
      - name: Read the pinned engine version
        id: pin
        run: |
          version=$(sed -n 's/^pub const PINNED_UPSTREAM_VERSION: &str = "\(.*\)";$/\1/p' crates/ktsense-lsp/src/version.rs)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `cargo install kmp-lsp` provides the engine only, not the kmp-jar-indexer sidecar; nothing
      # in this job assumes the sidecar exists.
      - name: Install kmp-lsp ${{ steps.pin.outputs.version }}
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: kmp-lsp@${{ steps.pin.outputs.version }}

      - name: Engine reports the pinned version
        run: kmp-lsp --version | tee /dev/stderr | grep -F "${{ steps.pin.outputs.version }}"

      # `kmp-lsp` shells out to `rg` for two of its features, and the runner image ships neither
      # `ripgrep` nor `fd-find`: its `find` defaults to `--fast` ("use rg/fd only") on a cold cache,
      # and `refs`, plus the `textDocument/references` its LSP session answers, needs `rg` warm or
      # cold. Without it both answer empty and exit 0, which is upstream's own shape for "matched
      # nothing", so the engine-dependent assertions here would be measuring a crippled engine
      # rather than the pinned one. Measured on `fixtures/multi-module`: 6 reference sites with `rg`,
      # 0 without, on the warm session and in command mode alike (KT-67).
      #
      # This is not what makes name resolution work. `trace` resolves a name the cold `find` missed
      # from its session's own index, and `tests/trace.rs` proves that against the fake with no
      # engine and no `rg` at all, in the install-free suite. `rg` is here for the engine's
      # reference enumeration, which ktsense cannot supply for it.
      - name: Install ripgrep, which the engine execs for find and references
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep

      - name: Test with the engine
        run: cargo test --workspace --locked --features ktsense-cli/real-lsp,ktsense-lsp/real-lsp

      - name: Build the release binary the benchmark measures
        run: cargo build -p ktsense-cli --release --locked

      - name: Restore the pinned corpora
        uses: actions/cache@v6
        with:
          path: bench/repos
          key: bench-repos-${{ hashFiles('bench/clone.sh') }}

      - name: Clone the pinned corpora
        run: bash bench/clone.sh

      - name: Compression gate, kotlinx.coroutines
        run: bash bench/compress.sh bench/repos/kotlinx.coroutines --max-percent 30

      - name: Compression gate, ktor
        run: bash bench/compress.sh bench/repos/ktor --max-percent 30
